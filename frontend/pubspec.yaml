name: checkon
description: Checkon (เช็คก่อน) - home consumable tracker
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logos/
    - assets/images/icons/
    - "assets/images/loading page/"
  shaders:
    - shaders/glass_lens.frag
  fonts:
    - family: Anuphan
      fonts:
        - asset: assets/fonts/anuphan/Anuphan-Variable.ttf
          weight: 100
          style: normal

flutter_launcher_icons:
  image_path: assets/images/icons/checkon_icon.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#EAF3F8"
  macos:
    generate: true
    image_path: assets/images/icons/checkon_icon.png
  web:
    generate: true
    image_path: assets/images/icons/checkon_icon.png
    background_color: "#EAF3F8"
    theme_color: "#477FA8"
